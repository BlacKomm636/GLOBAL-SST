# ============================================================
# Perfil de PRODUCCION (Render + Supabase)
# Activar con SPRING_PROFILES_ACTIVE=prod
# Todos los valores vienen de variables de entorno de Render.
# ============================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

supabase.url=${SUPABASE_URL}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:certificates}

app.public-verify-base-url=${PUBLIC_VERIFY_BASE_URL}

resend.api-key=${RESEND_API_KEY}
resend.from-email=${RESEND_FROM_EMAIL}

app.admin-bootstrap.email=${ADMIN_BOOTSTRAP_EMAIL}
app.admin-bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

logging.level.root=WARN
logging.level.com.certifica=INFO
