# ============================================================
# Perfil de DESARROLLO (local)
# Se activa por defecto. Usa docker-compose.yml para levantar
# un Postgres local en lugar de Supabase.
# ============================================================
spring.application.name=certifica-backend
server.port=${SERVER_PORT:8080}

# ---- Base de datos local (docker-compose) ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/certifica}
spring.datasource.username=${DB_USERNAME:certifica}
spring.datasource.password=${DB_PASSWORD:certifica}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---- JWT ----
security.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-1234567890}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# ---- CORS ----
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ---- Supabase Storage ----
supabase.url=${SUPABASE_URL:}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:certificates}

# ---- Verificacion publica (target del QR) ----
app.public-verify-base-url=${PUBLIC_VERIFY_BASE_URL:http://localhost:5173/verify}

# ---- Resend ----
resend.api-key=${RESEND_API_KEY:}
resend.from-email=${RESEND_FROM_EMAIL:no-reply@example.com}

# ---- Admin bootstrap ----
app.admin-bootstrap.email=${ADMIN_BOOTSTRAP_EMAIL:admin@example.com}
app.admin-bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:ChangeMe123!}

# ---- Swagger / OpenAPI ----
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ---- Logging ----
logging.level.root=INFO
logging.level.com.certifica=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
